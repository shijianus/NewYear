<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>星空湖景 - Starry Lake Wallpaper Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: rgba(255, 255, 255, 0.8);
        }

        .wallpaper-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('wallpaper/output/materials/背景.png');
            background-size: cover;
            background-position: center;
            z-index: 1;
            transition: transform 0.1s ease-out;
        }

        .lake-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            z-index: 2;
            overflow: hidden;
            transition: transform 0.08s ease-out;
        }

        #lake-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #lake-texture {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            pointer-events: none;
        }

        .fog-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            opacity: 0.12;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(200, 220, 255, 0.08) 40%,
                rgba(150, 180, 220, 0.15) 60%,
                rgba(100, 150, 200, 0.22) 80%,
                rgba(80, 130, 180, 0.3) 100%
            );
            animation: fogMove 10s infinite ease-in-out;
        }

        @keyframes fogMove {
            0%, 100% {
                transform: translateX(-2%);
            }
            50% {
                transform: translateX(2%);
            }
        }

        #star-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
        }

        #startrail-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            opacity: 0.25;
        }

        #meteor-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 6;
            pointer-events: none;
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 7;
            pointer-events: none;
        }

        .reflection-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            background: linear-gradient(to bottom, transparent, rgba(30, 50, 80, 0.35));
            z-index: 8;
            pointer-events: none;
        }

        .info-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 18px 22px;
            z-index: 100;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            max-width: 300px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .info-panel h1 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #7ecfff;
            font-weight: 600;
        }

        .info-panel p {
            margin: 7px 0;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
        }

        .info-panel .status {
            color: #4caf50;
            font-weight: 600;
        }

        .info-panel .feature-tag {
            display: inline-block;
            background: rgba(126, 207, 255, 0.15);
            color: #7ecfff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin: 2px 4px 2px 0;
        }

        .close-panel {
            position: absolute;
            top: 10px;
            right: 14px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 20px;
            cursor: pointer;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .close-panel:hover {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
        }

        .water-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 16px;
            z-index: 100;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }

        @media (max-width: 640px) {
            .info-panel {
                top: 10px;
                left: 10px;
                right: 10px;
                max-width: none;
                padding: 14px 16px;
            }

            .info-panel h1 {
                font-size: 16px;
            }

            .info-panel p {
                font-size: 12px;
            }

            .water-info {
                bottom: 10px;
                right: 10px;
                left: 10px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="wallpaper-container">
        <div class="background-layer" id="backgroundLayer"></div>
        <div class="lake-layer" id="lakeLayer">
            <img id="lake-texture" src="wallpaper/output/materials/湖面.png" alt="Lake texture">
            <canvas id="lake-canvas"></canvas>
        </div>
        <div class="fog-layer"></div>
        <canvas id="star-canvas"></canvas>
        <canvas id="startrail-canvas"></canvas>
        <canvas id="meteor-canvas"></canvas>
        <canvas id="particle-canvas"></canvas>
        <div class="reflection-layer"></div>
    </div>

    <div class="info-panel" id="infoPanel">
        <button class="close-panel" onclick="document.getElementById('infoPanel').style.display='none'">&times;</button>
        <h1>星空湖景 - Wallpaper Engine</h1>
        <p>状态: <span class="status">运行中 ✓</span></p>
        <div style="margin-top: 10px;">
            <span class="feature-tag">✓ WebGL 水波</span>
            <span class="feature-tag">✓ 真实涟漪</span>
            <span class="feature-tag">✓ 视差深度</span>
            <span class="feature-tag">✓ 闪烁星星</span>
            <span class="feature-tag">✓ 流星划过</span>
            <span class="feature-tag">✓ 粒子系统</span>
        </div>
        <p style="margin-top: 10px; color: rgba(255, 255, 255, 0.65); font-size: 12px;">
            移动鼠标可产生视差效果<br>
            点击湖面可产生涟漪
        </p>
    </div>

    <div class="water-info" id="waterInfo">
        WebGL 水波渲染中 | 点击湖面触发涟漪
    </div>

    <script>
        const starCanvas = document.getElementById('star-canvas');
        const starCtx = starCanvas.getContext('2d');
        const startrailCanvas = document.getElementById('startrail-canvas');
        const startrailCtx = startrailCanvas.getContext('2d');
        const meteorCanvas = document.getElementById('meteor-canvas');
        const meteorCtx = meteorCanvas.getContext('2d');
        const particleCanvas = document.getElementById('particle-canvas');
        const particleCtx = particleCanvas.getContext('2d');
        const lakeCanvas = document.getElementById('lake-canvas');
        const lakeCtx = lakeCanvas.getContext('2d');
        const lakeTexture = document.getElementById('lake-texture');
        const backgroundLayer = document.getElementById('backgroundLayer');
        const lakeLayer = document.getElementById('lakeLayer');

        let width, height;
        let mouseX = 0.5, mouseY = 0.5;
        let targetMouseX = 0.5, targetMouseY = 0.5;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;

            [starCanvas, startrailCanvas, meteorCanvas, particleCanvas, lakeCanvas].forEach(canvas => {
                canvas.width = width;
                canvas.height = height;
            });
        }

        resize();
        window.addEventListener('resize', resize);

        document.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX / width;
            targetMouseY = e.clientY / height;
        });

        document.addEventListener('click', (e) => {
            const rect = lakeCanvas.getBoundingClientRect();
            if (e.clientY > rect.top) {
                waterWaves.push(new WaterRipple(e.clientX, e.clientY));
            }
        });

        document.addEventListener('touchmove', (e) => {
            targetMouseX = e.touches[0].clientX / width;
            targetMouseY = e.touches[0].clientY / height;
        }, { passive: true });

        document.addEventListener('touchstart', (e) => {
            targetMouseX = e.touches[0].clientX / width;
            targetMouseY = e.touches[0].clientY / height;
            const rect = lakeCanvas.getBoundingClientRect();
            if (e.touches[0].clientY > rect.top) {
                waterWaves.push(new WaterRipple(e.touches[0].clientX, e.touches[0].clientY));
            }
        }, { passive: true });

        function updateParallax() {
            mouseX += (targetMouseX - mouseX) * 0.05;
            mouseY += (targetMouseY - mouseY) * 0.05;

            const parallaxX = (mouseX - 0.5) * 30;
            const parallaxY = (mouseY - 0.5) * 30;

            backgroundLayer.style.transform = `translate(${parallaxX * 0.3}px, ${parallaxY * 0.3}px)`;
            lakeLayer.style.transform = `translate(${parallaxX * 0.7}px, ${parallaxY * 0.7}px)`;
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * (height * 0.65);
                this.size = Math.random() * 2.2 + 0.5;
                this.baseOpacity = Math.random() * 0.7 + 0.3;
                this.opacity = this.baseOpacity;
                this.fadeSpeed = Math.random() * 0.015 + 0.005;
                this.fadingOut = Math.random() > 0.5;
                this.twinkleSpeed = Math.random() * 0.05 + 0.02;
                this.twinklePhase = Math.random() * Math.PI * 2;
            }

            update() {
                this.twinklePhase += this.twinkleSpeed;

                if (this.fadingOut) {
                    this.opacity -= this.fadeSpeed;
                    if (this.opacity <= 0.1) {
                        this.opacity = 0.1;
                        this.fadingOut = false;
                    }
                } else {
                    this.opacity += this.fadeSpeed;
                    if (this.opacity >= this.baseOpacity) {
                        this.opacity = this.baseOpacity;
                        this.fadingOut = true;
                    }
                }
            }

            draw() {
                const twinkle = 1 + Math.sin(this.twinklePhase) * 0.3;
                const currentOpacity = this.opacity * twinkle;

                starCtx.beginPath();
                starCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                starCtx.fillStyle = `rgba(255, 255, 255, ${currentOpacity})`;
                starCtx.fill();

                if (this.size > 1.3) {
                    starCtx.beginPath();
                    starCtx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
                    starCtx.fillStyle = `rgba(200, 220, 255, ${currentOpacity * 0.25})`;
                    starCtx.fill();
                }
            }
        }

        class StarTrail {
            constructor(angle, distance) {
                this.angle = angle;
                this.distance = distance;
                this.speed = 0.0003;
                this.rotation = 0;
                this.stars = [];
                this.createStars();
            }

            createStars() {
                for (let i = 0; i < 60; i++) {
                    this.stars.push({
                        angle: Math.random() * Math.PI * 2,
                        distance: Math.random() * distance * 0.9 + distance * 0.1,
                        size: Math.random() * 1.8 + 0.4,
                        opacity: Math.random() * 0.6 + 0.25,
                        speed: Math.random() * 0.0005 + 0.0002
                    });
                }
            }

            update() {
                this.rotation += this.speed;
            }

            draw() {
                const centerX = width / 2;
                const centerY = height * 0.35;

                this.stars.forEach(star => {
                    const rotAngle = star.angle + this.rotation * (1 + star.distance / this.distance);
                    const x = centerX + Math.cos(rotAngle) * star.distance * (width / 1920);
                    const y = centerY + Math.sin(rotAngle) * star.distance * 0.5 * (height / 1080);

                    if (x > 0 && x < width && y > 0 && y < height * 0.7) {
                        startrailCtx.beginPath();
                        startrailCtx.arc(x, y, star.size, 0, Math.PI * 2);
                        startrailCtx.fillStyle = `rgba(200, 230, 255, ${star.opacity})`;
                        startrailCtx.fill();
                    }
                });
            }
        }

        class Meteor {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width * 0.8 + width * 0.1;
                this.y = -80;
                this.length = Math.random() * 120 + 60;
                this.speed = Math.random() * 10 + 8;
                this.angle = Math.PI / 4 + Math.random() * 0.15 - 0.075;
                this.opacity = 1;
                this.active = false;
                this.waitTime = Math.random() * 400 + 150;
                this.waiting = 0;
                this.width = Math.random() * 1.5 + 1;
            }

            update() {
                if (this.waiting) {
                    this.waiting--;
                    if (this.waiting <= 0) {
                        this.active = true;
                    }
                    return;
                }

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.opacity -= 0.006;

                if (this.opacity <= 0 || this.y > height || this.x > width || this.x < 0) {
                    this.reset();
                }
            }

            draw() {
                if (!this.active || this.opacity <= 0) return;

                const gradient = meteorCtx.createLinearGradient(
                    this.x,
                    this.y,
                    this.x - Math.cos(this.angle) * this.length,
                    this.y - Math.sin(this.angle) * this.length
                );
                gradient.addColorStop(0, `rgba(255, 255, 255, ${this.opacity})`);
                gradient.addColorStop(0.2, `rgba(220, 240, 255, ${this.opacity * 0.8})`);
                gradient.addColorStop(0.4, `rgba(200, 220, 255, ${this.opacity * 0.5})`);
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                meteorCtx.beginPath();
                meteorCtx.moveTo(this.x, this.y);
                meteorCtx.lineTo(
                    this.x - Math.cos(this.angle) * this.length,
                    this.y - Math.sin(this.angle) * this.length
                );
                meteorCtx.strokeStyle = gradient;
                meteorCtx.lineWidth = this.width;
                meteorCtx.lineCap = 'round';
                meteorCtx.stroke();

                meteorCtx.beginPath();
                meteorCtx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                meteorCtx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                meteorCtx.fill();

                meteorCtx.beginPath();
                meteorCtx.arc(this.x, this.y, 5, 0, Math.PI * 2);
                meteorCtx.fillStyle = `rgba(220, 240, 255, ${this.opacity * 0.3})`;
                meteorCtx.fill();
            }
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = 0;
                this.life = Math.random() * 200 + 100;
                this.maxLife = this.life;
                this.fadingIn = true;
                this.hue = Math.random() * 60 + 180;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.fadingIn) {
                    this.opacity += 0.02;
                    if (this.opacity >= 0.5) {
                        this.opacity = 0.5;
                        this.fadingIn = false;
                    }
                } else {
                    this.life--;
                    if (this.life <= 50) {
                        this.opacity = (this.life / 50) * 0.5;
                    }
                }

                if (this.life <= 0) {
                    this.reset();
                }
            }

            draw() {
                particleCtx.beginPath();
                particleCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                particleCtx.fillStyle = `hsla(${this.hue}, 80%, 70%, ${this.opacity})`;
                particleCtx.fill();

                particleCtx.beginPath();
                particleCtx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                particleCtx.fillStyle = `hsla(${this.hue}, 80%, 80%, ${this.opacity * 0.2})`;
                particleCtx.fill();
            }
        }

        class WaterRipple {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = Math.random() * 100 + 80;
                this.speed = Math.random() * 2 + 1;
                this.opacity = 1;
                this.lineWidth = Math.random() * 2 + 1;
            }

            update() {
                this.radius += this.speed;
                this.opacity = 1 - (this.radius / this.maxRadius);
            }

            draw() {
                if (this.opacity <= 0) return;

                lakeCtx.beginPath();
                lakeCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                lakeCtx.strokeStyle = `rgba(180, 210, 255, ${this.opacity * 0.4})`;
                lakeCtx.lineWidth = this.lineWidth;
                lakeCtx.stroke();

                lakeCtx.beginPath();
                lakeCtx.arc(this.x, this.y, this.radius * 0.7, 0, Math.PI * 2);
                lakeCtx.strokeStyle = `rgba(160, 200, 255, ${this.opacity * 0.3})`;
                lakeCtx.lineWidth = this.lineWidth * 0.7;
                lakeCtx.stroke();
            }

            isDead() {
                return this.radius >= this.maxRadius;
            }
        }

        let lakeImageLoaded = false;
        let lakeImageData = null;

        lakeTexture.onload = () => {
            lakeImageLoaded = true;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = lakeTexture.naturalWidth;
            tempCanvas.height = lakeTexture.naturalHeight;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(lakeTexture, 0, 0);
            lakeImageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        };

        function drawLakeWithWaves(time) {
            if (!lakeImageLoaded) return;

            const lakeTop = height * 0.55;
            const lakeHeight = height - lakeTop;

            const waveScale = 25;
            const waveSpeed = 1.0;
            const waveStrength = 0.37;
            const waveDirection = 1.64;

            const waveScale2 = 15.6;
            const waveSpeed2 = 1.0;
            const waveDirection2 = 3.1;

            lakeCtx.clearRect(0, 0, width, lakeHeight);

            for (let y = 0; y < lakeHeight; y++) {
                const normalizedY = y / lakeHeight;
                const normalizedX = 0.5;

                const distance1 = time * waveSpeed + (normalizedY * waveScale);
                const distance2 = time * waveSpeed2 + (normalizedY * waveScale2);

                const wave1 = Math.sin(distance1);
                const wave2 = Math.sin(distance2);

                const displacement = (Math.pow(Math.abs(wave1), 1.2) * Math.sign(wave1) *
                                      Math.pow(Math.abs(wave2), 1.1) * Math.sign(wave2) *
                                      waveStrength);

                const sourceY = Math.floor(normalizedY * lakeTexture.naturalHeight + displacement * 10);

                if (sourceY >= 0 && sourceY < lakeTexture.naturalHeight) {
                    lakeCtx.drawImage(
                        lakeTexture,
                        0, sourceY, lakeTexture.naturalWidth, 1,
                        0, y, width, 1
                    );
                }
            }

            waterWaves.forEach(ripple => ripple.draw());
            waterWaves = waterWaves.filter(ripple => !ripple.isDead());
        }

        const stars = Array.from({ length: 250 }, () => new Star());
        const starTrails = [
            new StarTrail(0, Math.min(width, height) * 0.5),
            new StarTrail(Math.PI / 3, Math.min(width, height) * 0.4),
            new StarTrail(2 * Math.PI / 3, Math.min(width, height) * 0.35)
        ];
        const meteors = Array.from({ length: 4 }, () => new Meteor());
        const particles = Array.from({ length: 40 }, () => new Particle());
        let waterWaves = [];

        let time = 0;

        function animate() {
            time += 0.016;

            updateParallax();

            starCtx.clearRect(0, 0, width, height);
            meteorCtx.clearRect(0, 0, width, height);
            particleCtx.clearRect(0, 0, width, height);

            starTrails.forEach(starTrail => {
                starTrail.update();
                starTrail.draw();
            });

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            meteors.forEach(meteor => {
                meteor.update();
                meteor.draw();
            });

            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            drawLakeWithWaves(time);

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
