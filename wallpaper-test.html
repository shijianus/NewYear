<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpaper测试页面</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #000;
        }
        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
        }
        .info h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #4db8ff;
        }
        .info p {
            margin: 5px 0;
            font-size: 14px;
        }
        .info a {
            color: #4db8ff;
            text-decoration: none;
        }
        .info a:hover {
            text-decoration: underline;
        }
        .status {
            color: #4caf50;
            font-weight: bold;
        }
        .error {
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="info">
        <h1>Wallpaper星空湖景测试</h1>
        <p>状态: <span id="status" class="status">正在加载...</span></p>
        <p>效果: 星空闪烁 + 流星划过 + 湖面波纹</p>
        <p>移动鼠标产生视差效果，点击湖面产生涟漪</p>
        <p><a href="index.html">返回主页面 (index.html)</a></p>
        <p><a href="wallpaper.html" style="margin-left: 10px;">独立wallpaper页面</a></p>
    </div>

    <div class="container">
        <div class="background-layer"></div>
        <div class="lake-layer">
            <canvas id="water-canvas"></canvas>
        </div>
        <canvas id="star-canvas"></canvas>
        <canvas id="meteor-canvas"></canvas>
        <div class="reflection-layer"></div>
    </div>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('wallpaper/output/materials/初音未来4k.png');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        .lake-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            background-image: url('wallpaper/output/materials/湖面.png');
            background-size: cover;
            background-position: center;
            z-index: 2;
            overflow: hidden;
        }

        #water-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        #star-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
        }

        #meteor-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        .reflection-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            background: linear-gradient(to bottom, transparent, rgba(30, 50, 80, 0.2));
            z-index: 6;
            pointer-events: none;
        }
    </style>

    <script>
        const statusEl = document.getElementById('status');
        const starCanvas = document.getElementById('star-canvas');
        const starCtx = starCanvas.getContext('2d');
        const meteorCanvas = document.getElementById('meteor-canvas');
        const meteorCtx = meteorCanvas.getContext('2d');
        const waterCanvas = document.getElementById('water-canvas');
        const waterCtx = waterCanvas.getContext('2d');

        let width, height, lakeTop;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            starCanvas.width = width;
            starCanvas.height = height;
            meteorCanvas.width = width;
            meteorCanvas.height = height;
            
            lakeTop = height * 0.55;
            waterCanvas.width = width;
            waterCanvas.height = height - lakeTop;
        }

        resize();
        window.addEventListener('resize', resize);

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * (lakeTop * 0.7);
                this.size = Math.random() * 2.5 + 0.5;
                this.opacity = Math.random();
                this.fadeSpeed = Math.random() * 0.015 + 0.008;
                this.fadingOut = Math.random() > 0.5;
                this.twinkleOffset = Math.random() * Math.PI * 2;
            }

            update(time) {
                this.opacity = 0.5 + 0.5 * Math.sin(time * this.fadeSpeed + this.twinkleOffset);
            }

            draw() {
                starCtx.beginPath();
                starCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                starCtx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                starCtx.fill();

                if (this.size > 1.8) {
                    const glowSize = this.size * 3;
                    const gradient = starCtx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, glowSize
                    );
                    gradient.addColorStop(0, `rgba(200, 220, 255, ${this.opacity * 0.4})`);
                    gradient.addColorStop(1, 'rgba(200, 220, 255, 0)');
                    
                    starCtx.beginPath();
                    starCtx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
                    starCtx.fillStyle = gradient;
                    starCtx.fill();
                }
            }
        }

        class WaterRipple {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = Math.random() * 100 + 80;
                this.opacity = 0.6;
                this.speed = Math.random() * 2 + 1;
                this.active = true;
                this.rings = Math.floor(Math.random() * 2) + 2;
            }

            update() {
                this.radius += this.speed;
                this.opacity -= 0.012;
                
                if (this.opacity <= 0 || this.radius > this.maxRadius) {
                    this.active = false;
                }
            }

            draw() {
                for (let i = 0; i < this.rings; i++) {
                    const ringRadius = this.radius - i * 20;
                    if (ringRadius > 0) {
                        const ringOpacity = this.opacity * (1 - i / this.rings) * 0.5;
                        
                        waterCtx.beginPath();
                        waterCtx.arc(this.x, this.y, ringRadius, 0, Math.PI * 2);
                        waterCtx.strokeStyle = `rgba(200, 230, 255, ${ringOpacity})`;
                        waterCtx.lineWidth = 1.5;
                        waterCtx.stroke();
                    }
                }
            }
        }

        class Meteor {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -50;
                this.length = Math.random() * 150 + 80;
                this.speed = Math.random() * 10 + 8;
                this.angle = Math.PI / 4 + Math.random() * 0.3;
                this.opacity = 1;
                this.active = false;
                this.waitTime = Math.random() * 400 + 200;
                this.waiting = 0;
            }

            update() {
                if (this.waiting) {
                    this.waiting--;
                    if (this.waiting <= 0) {
                        this.active = true;
                    }
                    return;
                }

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.opacity -= 0.006;

                if (this.opacity <= 0 || this.y > height || this.x > width) {
                    this.reset();
                }
            }

            draw() {
                if (!this.active || this.opacity <= 0) return;

                const gradient = meteorCtx.createLinearGradient(
                    this.x,
                    this.y,
                    this.x - Math.cos(this.angle) * this.length,
                    this.y - Math.sin(this.angle) * this.length
                );
                gradient.addColorStop(0, `rgba(255, 255, 255, ${this.opacity})`);
                gradient.addColorStop(0.2, `rgba(220, 240, 255, ${this.opacity * 0.8})`);
                gradient.addColorStop(0.5, `rgba(180, 210, 255, ${this.opacity * 0.5})`);
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                meteorCtx.beginPath();
                meteorCtx.moveTo(this.x, this.y);
                meteorCtx.lineTo(
                    this.x - Math.cos(this.angle) * this.length,
                    this.y - Math.sin(this.angle) * this.length
                );
                meteorCtx.strokeStyle = gradient;
                meteorCtx.lineWidth = 3;
                meteorCtx.lineCap = 'round';
                meteorCtx.stroke();

                const headSize = 4;
                const headGradient = meteorCtx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, headSize
                );
                headGradient.addColorStop(0, `rgba(255, 255, 255, ${this.opacity})`);
                headGradient.addColorStop(0.5, `rgba(220, 240, 255, ${this.opacity * 0.8})`);
                headGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                meteorCtx.beginPath();
                meteorCtx.arc(this.x, this.y, headSize, 0, Math.PI * 2);
                meteorCtx.fillStyle = headGradient;
                meteorCtx.fill();
            }
        }

        const stars = Array.from({ length: 250 }, () => new Star());
        const meteors = Array.from({ length: 4 }, () => new Meteor());
        const ripples = [];
        let lastRippleTime = 0;

        function animate(time) {
            starCtx.clearRect(0, 0, width, height);
            meteorCtx.clearRect(0, 0, width, height);
            waterCtx.clearRect(0, 0, width, waterCanvas.height);

            stars.forEach(star => {
                star.update(time / 1000);
                star.draw();
            });

            meteors.forEach(meteor => {
                meteor.update();
                meteor.draw();
            });

            for (let i = ripples.length - 1; i >= 0; i--) {
                ripples[i].update();
                ripples[i].draw();
                
                if (!ripples[i].active) {
                    ripples.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate(0);
        
        statusEl.textContent = '运行中 ✓';

        const lakeLayer = document.querySelector('.lake-layer');
        
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / width - 0.5) * 2;
            const y = (e.clientY / height - 0.5) * 2;
            lakeLayer.style.transform = `translate(${x * 8}px, ${y * 8}px)`;
        });

        document.addEventListener('click', (e) => {
            const rect = waterCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (y >= 0 && y <= waterCanvas.height) {
                ripples.push(new WaterRipple(x, y));
            }
        });

        setInterval(() => {
            const x = Math.random() * width;
            const y = Math.random() * waterCanvas.height;
            ripples.push(new WaterRipple(x, y));
        }, 2000);
    </script>
</body>
</html>
